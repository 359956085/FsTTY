name: Windows Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 提取更新说明
        id: release_notes
        shell: pwsh
        run: node scripts/extract-release-notes.mjs "$env:GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: 安装 Rust 依赖审计工具
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: 审计 Rust 依赖
        run: cargo audit --file src-tauri/Cargo.lock
      - run: npm run verify:all
      - name: 注入更新公钥
        shell: pwsh
        env:
          FSTTY_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FSTTY_UPDATER_PUBLIC_KEY)) {
            throw "缺少 Actions Variable：TAURI_SIGNING_PUBLIC_KEY"
          }

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          # 打包器只读取配置文件；运行时 Builder 注入无法参与更新包签名。
          $config.plugins.updater.pubkey = $env:FSTTY_UPDATER_PUBLIC_KEY.Trim()
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $configPath
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私钥只能放在 Actions Secrets，禁止放入普通 Variables。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: FsTTY ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
      - name: 下载 GitHub Release 附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$env:GITHUB_REF_NAME" --dir .cnb-release --clobber
      - name: 同步标签到 CNB
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CNB_TOKEN)) {
            throw "缺少 Actions Secret：CNB_TOKEN"
          }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("cnb:$env:CNB_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" push --force `
            https://cnb.cool/359956085/FsTTY.git "$env:GITHUB_REF_NAME`:refs/tags/$env:GITHUB_REF_NAME"
      - name: 同步 Release 到 CNB
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: node scripts/sync-cnb-release.mjs 359956085/FsTTY "$env:GITHUB_REF_NAME" "$env:GITHUB_SHA" .cnb-release
