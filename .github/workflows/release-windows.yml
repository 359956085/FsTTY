name: Windows Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 正式发布；关闭时从默认分支生成未签名验证包
        type: boolean
        default: false
      cold-cache:
        description: 跳过 Rust 缓存恢复，用于测量冷构建
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 发布准备
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      tag: ${{ steps.prepare.outputs.tag }}
      mode: ${{ steps.prepare.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check:version
      - id: prepare
        name: 校验标签和更新说明
        env:
          FSTTY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FSTTY_PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: node scripts/release-artifacts.mjs prepare

  verify:
    name: 发布前完整检查
    needs: prepare
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/ci/verify
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/windows-build-setup
        with:
          cache-group: verify
          workspaces: src-tauri -> target/ci/verify
          cold-cache: ${{ inputs.cold-cache || false }}
      - run: npm ci
      - uses: ./.github/actions/rust-audit
      - name: 前端与版本检查
        run: npm run verify
      - name: Rust 格式、Clippy 与测试
        run: npm run verify:rust

  build:
    name: Windows 构建与产物
    needs: prepare
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/ci/desktop
      FSTTY_BROKER_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/ci/broker
      FSTTY_RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
      FSTTY_REQUIRE_AUTHENTICODE: ${{ needs.prepare.outputs.mode == 'release' && '1' || '0' }}
      FSTTY_AUTHENTICODE_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/windows-build-setup
        with:
          cache-group: release
          workspaces: |
            src-tauri -> target/ci/desktop
            src-tauri -> target/ci/broker
          cold-cache: ${{ inputs.cold-cache || false }}
      - run: npm ci
      - name: 导入 Windows Authenticode 证书
        if: needs.prepare.outputs.mode == 'release'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { throw "缺少 Actions Secret：WINDOWS_CERTIFICATE" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "缺少 Actions Secret：WINDOWS_CERTIFICATE_PASSWORD" }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'fstty-authenticode.pfx'
          try {
            $encoded = $env:WINDOWS_CERTIFICATE -replace '\s', ''
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($encoded))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $signers = @($certificates | Where-Object {
              $_.HasPrivateKey -and ($_.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3')
            })
            if ($signers.Count -ne 1) { throw "PFX 必须包含且只包含一张带私钥的代码签名证书" }
            "FSTTY_AUTHENTICODE_THUMBPRINT=$($signers[0].Thumbprint.ToUpperInvariant())" >> $env:GITHUB_ENV
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: 编译前核对更新公钥
        env:
          FSTTY_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/ci-build.mjs configure
      - name: 前端构建
        run: node scripts/ci-build.mjs frontend
      - name: Broker 静态运行库构建
        run: node scripts/ci-build.mjs broker
      - name: Broker Authenticode 签名
        if: needs.prepare.outputs.mode == 'release'
        run: node scripts/ci-build.mjs authenticode-broker
      - name: 桌面正式编译
        run: node scripts/ci-build.mjs desktop
      - name: NSIS 安装包生成
        run: node scripts/ci-build.mjs bundle
      - name: 校验全部 Authenticode 签名
        if: needs.prepare.outputs.mode == 'release'
        run: node scripts/ci-build.mjs verify-authenticode
      - name: 签署更新安装包
        if: needs.prepare.outputs.mode == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/ci-build.mjs sign
      - name: 整理与校验正式发布产物
        if: needs.prepare.outputs.mode == 'release'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/release-artifacts.mjs collect
      - name: 整理与校验未签名验证产物
        if: needs.prepare.outputs.mode == 'validation'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/release-artifacts.mjs collect-validation
      - name: 开始产物上传计时
        id: artifact-clock
        shell: pwsh
        run: '"started=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT'
      - name: 上传本次运行的正式发布产物
        id: upload-release
        if: needs.prepare.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}
          path: artifacts/windows-release/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: 上传本次运行的未签名验证产物
        id: upload-validation
        if: needs.prepare.outputs.mode == 'validation'
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ github.run_id }}
          path: artifacts/windows-validation/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: 记录正式发布产物体积与上传耗时
        if: needs.prepare.outputs.mode == 'release'
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload-release.outputs.artifact-url }}
          ARTIFACT_STARTED: ${{ steps.artifact-clock.outputs.started }}
        run: |
          $size = (Get-ChildItem -LiteralPath artifacts/windows-release -File | Measure-Object -Property Length -Sum).Sum
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:ARTIFACT_STARTED
          "- 发布产物：$([Math]::Round($size / 1MB, 2)) MiB；Artifact 上传 $elapsed 秒；$env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY
      - name: 记录未签名验证产物体积与上传耗时
        if: needs.prepare.outputs.mode == 'validation'
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload-validation.outputs.artifact-url }}
          ARTIFACT_STARTED: ${{ steps.artifact-clock.outputs.started }}
        run: |
          $size = (Get-ChildItem -LiteralPath artifacts/windows-validation -File | Measure-Object -Property Length -Sum).Sum
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:ARTIFACT_STARTED
          "- 未签名验证产物：$([Math]::Round($size / 1MB, 2)) MiB；Artifact 上传 $elapsed 秒；$env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: GitHub 发布与 CNB 同步
    needs: [prepare, verify, build]
    if: needs.prepare.outputs.mode == 'release'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}
          path: artifacts/windows-release/
      - name: 草稿上传、核对附件并正式发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/publish-github-release.mjs
      - name: 同步标签到 CNB
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CNB_TOKEN)) { throw "缺少 Actions Secret：CNB_TOKEN" }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("cnb:$env:CNB_TOKEN"))
          Write-Output "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" push --force https://cnb.cool/359956085/FsTTY.git "$env:RELEASE_COMMIT`:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "CNB 标签同步失败" }
      - name: 使用本地产物同步 CNB Release
        shell: pwsh
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/sync-cnb-release.mjs 359956085/FsTTY "$env:RELEASE_TAG" "$env:RELEASE_COMMIT" artifacts/release-assets
