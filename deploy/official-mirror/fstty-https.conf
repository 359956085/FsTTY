server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name f.qkw.io;

    ssl_certificate /etc/letsencrypt/live/f.qkw.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f.qkw.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /fstty/updater/latest.json {
        alias /srv/fstty-mirror/public/updater/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /fstty/releases/ {
        alias /srv/fstty-mirror/public/releases/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
