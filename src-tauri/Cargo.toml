[package]
name = "fstty"
version = "0.1.0"
description = "FsTTY"
authors = ["fengshi"]
edition = "2021"

[lib]
name = "fstty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }

