[package]
name = "fstty"
version = "1.2.0"
description = "FsTTY"
authors = ["fengshi"]
edition = "2021"

[lib]
name = "fstty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
fs2 = "0.4"
log = "0.4"
jsonc-parser = { version = "0.33", features = ["cst", "serde"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.3"
rmcp = { version = "=3.0.0-beta.3", features = ["transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
keyring-core = "1"
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(not(target_os = "windows"))'.dependencies]
keyring = "4.1"
