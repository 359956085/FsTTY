[package]
name = "fstty-network"
version = "1.7.1"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "net", "time", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
serde_json = "1"
